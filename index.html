<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zmad</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      text-align: center;
      padding: 60px 40px;
      background: #1a1a1a;
      border-radius: 16px;
      border: 1px solid #333;
      max-width: 480px;
      width: 90%;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #e63946;
      margin-bottom: 12px;
    }

    p {
      color: #aaa;
      margin-bottom: 40px;
      font-size: 0.95rem;
    }

    .btn-download {
      display: inline-block;
      background: #e63946;
      color: #fff;
      padding: 14px 40px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-download:hover {
      background: #c1121f;
      transform: scale(1.04);
    }

    .version {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Zmad</h1>
    <p>Baixe agora e comece a jogar!</p>

    <!-- ✅ Troque o href pelo link do seu arquivo -->
    <a class="btn-download" href="zmad_v1.0.zip" download>
      ⬇ Download
    </a>

    <!-- ✅ Atualize a versão aqui -->
    <p class="version">v1.0</p>
  </div>
</body>
</html>
